[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["core", "User", "ingestion", "orchestration", "harness", "payments", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests", "User", "core", "ingestion", "orchestration", "harness", "payments"]
