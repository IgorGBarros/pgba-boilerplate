# backend_api/docker-compose.yml
# Stack de desenvolvimento local do boilerplate PGBA.
# Sobe: Postgres com pgvector, Redis (Celery), backend Django, worker Celery,
# beat (sync periódico do Obsidian) e (opcional) Ollama para IA local.
#
# Uso:
#   cp .env.example .env   # ajuste os valores
#   docker compose up --build

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pgba}
      POSTGRES_USER: ${DB_USER:-pgba}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pgba}
      EVOLUTION_DB_NAME: ${EVOLUTION_DB_NAME:-evolution_db}
    volumes:
      - pgba_pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pgba}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "redis-server ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./Api:/app/Api
      # Monte seu(s) vault(s) do Obsidian aqui para o sync poder lê-los:
      - ${OBSIDIAN_VAULT_PATH:-./vaults}:/vaults:ro
      # Templates de projeto (React/Vite/TS) moram em frontend/ — é
      # conteúdo de frontend de verdade, não deveria estar fisicamente
      # dentro da árvore do backend Python. Montado só-leitura porque
      # agency.services só LÊ esses arquivos pra empurrar pro GitHub via
      # API (nunca escreve, nunca roda `npm`/`.mjs` neles — isso é 100%
      # Python + httpx, sem Node.js envolvido nesta etapa).
      - ../frontend/project-templates:/app/project-templates:ro

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: []
    command: >
      sh -c "cd /app/Api && celery -A config worker --loglevel=info"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Api:/app/Api
      - ${OBSIDIAN_VAULT_PATH:-./vaults}:/vaults:ro

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: []
    command: >
      sh -c "cd /app/Api && celery -A config beat --loglevel=info"
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./Api:/app/Api

  # Opcional: LLM local para embeddings + chat (RAG). Comente se preferir
  # rodar o Ollama fora do Docker (mais rápido com GPU do host).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - pgba_ollama_data:/root/.ollama

  # Evolution API — WhatsApp via Baileys. Usa o mesmo Postgres e Redis do
  # stack PGBA; banco lógico separado (evolution_db) para não misturar schemas.
  # Docs: https://github.com/evolution-foundation/evolution-api
  evolution:
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-change-me-in-env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      # Banco dedicado no mesmo Postgres
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER:-pgba}:${DB_PASSWORD:-pgba}@db:5432/${EVOLUTION_DB_NAME:-evolution_db}
      DATABASE_CONNECTION_CLIENT_NAME: evolution_exchange
      # Redis compartilhado, banco lógico /6
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_SAVE_INSTANCES: "false"
      DEL_INSTANCE: "false"
      # Telemetria desligada por padrão (LGPD / privacidade)
      TELEMETRY_ENABLED: "false"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 🕷️ Google Maps Scraper (opcional — só sobe com --profile scraping)
  # Baseado em gosom/google-maps-scraper (MIT) via google-maps-scraper-kit
  # Uso: docker compose --profile scraping up -d gmaps-scraper
  # API disponível em http://localhost:8080 (bind local only)
  gmaps-scraper:
    image: gosom/google-maps-scraper:latest
    profiles: ["scraping"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DSN: ${GMAPS_SCRAPER_DSN:-}   # opcional: postgres para persistência de jobs
    restart: unless-stopped

volumes:
  pgba_pg_data:
  pgba_ollama_data:
  evolution_instances:
